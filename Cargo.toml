[workspace]
members = ["crates/sprawl-guard", "crates/sprawl-guard-lib"]
resolver = "3"

[workspace.dependencies]
askama = "=0.12.1"
assert_fs = "=1.1.4"
clap = { version = "=4.6.1" }
globset = "=0.4.18"
ignore = "=0.4.26"
indoc = "=2.0.7"
nutype = "=0.7.0"
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
rayon = "=1.12.0"
schemars = "=1.2.1"
serde = "=1.0.228"
serde_json = "=1.0.150"
syn = { version = "=2.0.117", features = ["full", "parsing"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokei = { version = "=14.0.0", default-features = false }
toml = "=0.9.12"
toml_edit = "=0.25.12"

[patch.crates-io]
tokei = { path = "third_party/rust/tokei-14.0.0-sprawl-guard" }
