[workspace]
members = ["crates/sprawl-guard", "crates/sprawl-guard-lib"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
assert_fs = "=1.1.4"
clap = { version = "=4.6.7" }
globset = "=0.4.21"
ignore = "=0.4.34"
indoc = "=2.0.8"
nutype = "=0.8.0"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
rayon = "=1.12.0"
schemars = "=1.2.3"
serde = "=1.0.229"
serde_json = "=1.0.154"
syn = { version = "=3.0.9", features = ["full", "parsing"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokei = { version = "=15.0.0", default-features = false }
toml = "=1.1.8"
toml_edit = "=0.25.17"

[patch.crates-io]
tokei = { path = "third_party/rust/tokei-15.0.0-sprawl-guard" }
