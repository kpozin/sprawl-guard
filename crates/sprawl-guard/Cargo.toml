[package]
name = "sprawl-guard"
version = "0.6.0-beta.2"
edition = "2024"
description = "Repository sprawl checker CLI."
documentation = "https://docs.rs/sprawl-guard"
homepage = "https://github.com/kpozin/sprawl-guard"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/kpozin/sprawl-guard"
keywords = ["lint", "repository", "architecture", "ratchet"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["BUILD.bazel"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
indoc.workspace = true
nutype.workspace = true
serde.workspace = true
serde_json.workspace = true
sprawl-guard-lib = { version = "=0.6.0-beta.2", path = "../sprawl-guard-lib" }
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

# musl's own allocator is many times slower when several threads allocate at once.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
assert_fs.workspace = true

[[test]]
name = "cli"
path = "tests/cli/mod.rs"
