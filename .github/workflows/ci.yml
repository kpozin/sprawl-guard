name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push can add several commits at once; only the newest needs a full run. The event is
# part of the group so that a push never cancels a manual run, the only one that covers macOS.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Package workspace crates
        run: cargo package --locked --workspace

      - name: Validate crate archives
        env:
          PYTHONPATH: .github/scripts
        run: python3 -m sprawl_guard_public_archive target/package

      - name: Dry-run publish library crate
        run: cargo publish --locked --dry-run -p sprawl-guard-lib

  bazel:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The runner image provides Bazelisk as `bazel`; it reads `.bazelversion`.
      - name: Test workspace
        run: bazel test //...

      - name: Build a workspace that depends on this one
        working-directory: testing/consumer-workspace
        run: USE_BAZEL_VERSION="$(cat ../../.bazelversion)" bazel build //...

  runtime-targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Resolve native runtime matrix
        id: matrix
        # macOS targets run only when CI is started by hand; see CiRuntimePlatforms.
        run: >-
          node npm/scripts/runtime-target-matrix.ts
          ${{ github.event_name == 'workflow_dispatch' && 'ci' || 'ci-except-darwin' }}

  runtime-smoke:
    needs: runtime-targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.runtime-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: npm/pnpm-lock.yaml

      - name: Install musl linker
        if: ${{ matrix.rust_target == 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build native CLI
        run: cargo build --locked --package sprawl-guard --target "${{ matrix.rust_target }}"

      - name: Install npm workspace dependencies
        working-directory: npm
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Check native CLI
        working-directory: npm
        shell: bash
        run: node scripts/workflow-checks/check-cli.ts -- "${SPRAWL_GUARD_BINARY}"
        env:
          SPRAWL_GUARD_BINARY: ${{ github.workspace }}/${{ matrix.built_binary_path }}

      - name: Build npm wrapper
        working-directory: npm
        run: pnpm run build

      - name: Check npm wrapper
        working-directory: npm
        shell: bash
        run: node scripts/workflow-checks/check-cli.ts -- node ./sprawl-guard/dist/bin/sprawl-guard.js
        env:
          SPRAWL_GUARD_BINARY: ${{ github.workspace }}/${{ matrix.built_binary_path }}

  npm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: npm/pnpm-lock.yaml

      - name: Install npm workspace dependencies
        working-directory: npm
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Check npm workspace
        working-directory: npm
        run: pnpm run check

      - name: Install rendered publish workspace
        working-directory: npm
        run: pnpm run install:rendered-publish-workspace

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install documentation dependencies
        working-directory: site
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        working-directory: site
        run: pnpm run check
