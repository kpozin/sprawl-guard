name: Deploy documentation

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full commit SHA of the published release
        required: true
        type: string
      release_tag:
        description: Published v-prefixed release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install release tooling dependencies
        working-directory: npm
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and package versions
        id: release
        working-directory: npm
        env:
          GITHUB_EVENT_COMMIT: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: pnpm run release:metadata

      - name: Verify manual deployment uses a published stable release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          is_stable="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')"
          if [[ "${is_stable}" != "true" ]]; then
            echo "release must be published and stable: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Install documentation dependencies
        working-directory: site
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        working-directory: site
        env:
          PUBLIC_SPRAWL_GUARD_VERSION: ${{ steps.release.outputs.release_version }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
