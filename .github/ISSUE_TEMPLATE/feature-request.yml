name: Feature request
description: Request a new capability or policy surface.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the repository-management problem you need to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Describe the CLI, config, or reporting shape you expect.
    validations:
      required: true
